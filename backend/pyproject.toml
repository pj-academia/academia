[project]
name = "academia-backend"
version = "0.1.0"
description = "Academia IA backend: AI tutor with persistent learner memory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/memory/domain", "app/memory/application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires Postgres and ChromaDB running (docker compose up -d --wait)"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Memory module follows hexagonal layering"
type = "layers"
layers = [
    "app.memory.api | app.memory.infrastructure",
    "app.memory.application",
    "app.memory.domain",
]

[[tool.importlinter.contracts]]
name = "Memory domain is framework-free"
type = "forbidden"
source_modules = ["app.memory.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "httpx", "pydantic_settings"]

[[tool.importlinter.contracts]]
name = "Shared kernel does not depend on feature modules"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.health", "app.memory", "app.bootstrap", "app.main"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
