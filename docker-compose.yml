# Infrastructure services have no profile: `docker compose up` starts only them (daily local work).
# Applications use the "app" profile: `docker compose --profile app up` starts the full system.

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academia}
      POSTGRES_DB: ${POSTGRES_DB:-academia}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data in a versioned subfolder of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      # The image ships without curl/wget, so the heartbeat is requested through bash /dev/tcp.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Lets Prometheus scrape the backend running natively on the host, also on Linux.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    profiles: ["app"]
    build: ./backend
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-academia}:${POSTGRES_PASSWORD:-academia}@postgres:5432/${POSTGRES_DB:-academia}
      CHROMA_URL: http://chromadb:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        # The browser runs on the host, so it reaches the backend through the published port.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  chroma-data:
  prometheus-data:
  grafana-data:
